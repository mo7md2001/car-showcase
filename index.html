<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light dark">
<title>معرض السيارات</title>
<meta name="description" content="معرض السيارات — تصفح السيارات المتاحة بالصور والأسعار والمواصفات والوصف الكامل.">
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f3f5f7;
    --surface:#ffffff;
    --surface-2:#eef2f5;
    --ink:#182430;
    --muted:#5d6f7e;
    --line:#dde4ea;
    --price:#0b6e4f;
    --band:#101d29;
    --band-ink:#f2f6f9;
    --sold:#bc232a;
    --chip-bg:#eef2f5;
    --shadow:0 1px 2px rgba(16,29,41,.06),0 8px 24px rgba(16,29,41,.07);
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#0c1319;
      --surface:#152029;
      --surface-2:#1b2a37;
      --ink:#e9eff4;
      --muted:#9db0c0;
      --line:#27394a;
      --price:#43c08d;
      --band:#0a141e;
      --chip-bg:#1b2a37;
      --shadow:0 1px 2px rgba(0,0,0,.35),0 8px 24px rgba(0,0,0,.35);
    }
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:"IBM Plex Sans Arabic",system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif;
    background:var(--bg);color:var(--ink);line-height:1.6;
    -webkit-font-smoothing:antialiased;
  }
  img{display:block;max-width:100%}

  /* ---------- Header band ---------- */
  .band{background:var(--band);color:var(--band-ink)}
  .band-in{max-width:1180px;margin:0 auto;padding:26px 18px 24px}
  .site-name{font-size:15px;font-weight:600;opacity:.85}
  .band h1{font-size:clamp(28px,5.5vw,40px);font-weight:700;line-height:1.25;margin-top:2px}
  .band .sub{margin-top:6px;font-size:15px;color:#b9c9d6;max-width:56ch}
  .band .meta{margin-top:14px;display:flex;flex-wrap:wrap;gap:8px;font-size:13.5px}
  .band .meta span{background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.14);padding:5px 12px;border-radius:999px}

  /* ---------- Grid ---------- */
  main{max-width:1180px;margin:0 auto;padding:22px 14px 40px}
  .grid{display:grid;grid-template-columns:1fr;gap:18px}
  @media (min-width:640px){.grid{grid-template-columns:repeat(2,1fr)}}
  @media (min-width:1024px){.grid{grid-template-columns:repeat(3,1fr)}}

  .card{
    background:var(--surface);border:1px solid var(--line);border-radius:14px;
    overflow:hidden;box-shadow:var(--shadow);display:flex;flex-direction:column;
  }

  /* ---------- Gallery ---------- */
  .photo-wrap{position:relative;background:var(--surface-2)}
  .photo-main{width:100%;aspect-ratio:4/3;object-fit:cover;cursor:zoom-in;background:var(--surface-2)}
  .card.sold .photo-main,.card.sold .thumb img{filter:saturate(.3) brightness(.86)}
  .badge-sold{
    position:absolute;top:12px;inset-inline-start:12px;z-index:2;
    background:var(--sold);color:#fff;font-weight:700;font-size:15px;
    padding:5px 16px;border-radius:8px;box-shadow:0 4px 14px rgba(0,0,0,.3);
  }
  .photo-count{
    position:absolute;bottom:10px;inset-inline-end:10px;z-index:2;
    background:rgba(10,18,26,.72);color:#fff;font-size:12.5px;font-weight:500;
    padding:3px 10px;border-radius:999px;
  }
  .thumbs{display:flex;flex-wrap:wrap;gap:6px;padding:8px 10px 2px}
  .thumb{
    width:52px;height:40px;border-radius:7px;overflow:hidden;padding:0;cursor:pointer;
    border:2px solid transparent;background:var(--surface-2);flex:0 0 auto;
  }
  .thumb img{width:100%;height:100%;object-fit:cover}
  .thumb.active{border-color:var(--price)}
  .thumb:focus-visible,.photo-main:focus-visible{outline:3px solid var(--price);outline-offset:2px}

  /* ---------- Card body ---------- */
  .body{padding:14px 16px 18px;display:flex;flex-direction:column;gap:12px;flex:1}
  .car-title{font-size:19px;font-weight:700;line-height:1.4}
  .price{font-size:24px;font-weight:700;color:var(--price);line-height:1.3}
  .price small{font-size:15px;font-weight:600}
  .card.sold .price{color:var(--muted)}

  .specs{display:grid;grid-template-columns:1fr 1fr;gap:7px}
  .spec{background:var(--chip-bg);border-radius:9px;padding:7px 11px;min-height:44px}
  .spec .k{display:block;font-size:12px;color:var(--muted);font-weight:500}
  .spec .v{display:block;font-size:14.5px;font-weight:600;line-height:1.45}

  .desc-wrap{display:flex;flex-direction:column;gap:6px}
  .desc{
    font-size:14.5px;line-height:1.85;color:var(--ink);white-space:pre-line;
    overflow:hidden;position:relative;
  }
  .desc.clamped{max-height:9.2em}
  .desc.clamped::after{
    content:"";position:absolute;inset-inline:0;bottom:0;height:3.2em;
    background:linear-gradient(to bottom,transparent,var(--surface));
  }
  .toggle-desc{
    align-self:flex-start;background:none;border:none;cursor:pointer;
    color:var(--price);font:inherit;font-size:14px;font-weight:600;
    padding:8px 4px;min-height:40px;
  }
  .toggle-desc:hover{text-decoration:underline}

  .empty{
    background:var(--surface);border:1px dashed var(--line);border-radius:14px;
    padding:44px 20px;text-align:center;color:var(--muted);font-size:16px;
  }

  footer{max-width:1180px;margin:0 auto;padding:0 18px 34px;color:var(--muted);font-size:13.5px;text-align:center}

  /* ---------- Lightbox ---------- */
  .lightbox{
    position:fixed;inset:0;z-index:50;background:rgba(6,11,16,.94);
    display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:16px;
  }
  .lightbox.open{display:flex}
  .lb-img{max-width:100%;max-height:76vh;object-fit:contain;border-radius:10px}
  .lb-bar{display:flex;align-items:center;gap:10px;color:#e8eff4}
  .lb-btn{
    width:46px;height:46px;border-radius:50%;border:1px solid rgba(255,255,255,.25);
    background:rgba(255,255,255,.08);color:#fff;font-size:20px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
  }
  .lb-btn:hover{background:rgba(255,255,255,.18)}
  .lb-count{font-size:14px;min-width:64px;text-align:center}
  .lb-close{position:absolute;top:14px;inset-inline-end:14px}
  .lb-title{color:#c7d4df;font-size:14.5px;text-align:center}
</style>
</head>
<body>

<header class="band">
  <div class="band-in">
    <div class="site-name">معرض السيارات</div>
    <h1>السيارات المتاحة</h1>
    <p class="sub">تصفح السيارات المعروضة بالصور والأسعار والمواصفات الكاملة، وكل عربية بوصفها التفصيلي.</p>
    <div class="meta" id="bandMeta"></div>
  </div>
</header>

<main>
  <div class="grid" id="grid"></div>
  <div class="empty" id="emptyState" hidden>لا توجد سيارات معروضة حالياً.</div>
</main>

<footer>معرض السيارات — جميع الأسعار بالجنيه المصري.</footer>

<!-- Lightbox -->
<div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="معرض صور السيارة">
  <button class="lb-btn lb-close" id="lbClose" aria-label="إغلاق">✕</button>
  <img class="lb-img" id="lbImg" alt="">
  <div class="lb-title" id="lbTitle"></div>
  <div class="lb-bar">
    <button class="lb-btn" id="lbPrev" aria-label="الصورة السابقة">›</button>
    <span class="lb-count" id="lbCount"></span>
    <button class="lb-btn" id="lbNext" aria-label="الصورة التالية">‹</button>
  </div>
</div>

<script>
(function(){
  "use strict";
  var data = JSON.parse(document.getElementById('cars-data').textContent);
  var cars = (data.cars || []).slice();
  // المتاح أولاً ثم المباع، مع الحفاظ على ترتيب كل مجموعة
  cars.sort(function(a,b){
    var ra = a.status === 'sold' ? 1 : 0, rb = b.status === 'sold' ? 1 : 0;
    return ra - rb;
  });

  var nf = new Intl.NumberFormat('ar-EG-u-nu-latn');
  function fmt(n){ return nf.format(n); }
  function esc(s){
    return String(s == null ? '' : s)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
      .replace(/"/g,'&quot;');
  }

  // شريط المعلومات العلوي
  var avail = cars.filter(function(c){return c.status !== 'sold';}).length;
  var soldCount = cars.length - avail;
  var meta = document.getElementById('bandMeta');
  var parts = [];
  parts.push('<span>' + fmt(avail) + ' سيارات متاحة</span>');
  if (soldCount > 0) parts.push('<span>' + fmt(soldCount) + ' مباعة</span>');
  if (data.updatedAt){
    try{
      var d = new Date(data.updatedAt + 'T00:00:00');
      var ds = new Intl.DateTimeFormat('ar-EG-u-nu-latn',{day:'numeric',month:'long',year:'numeric'}).format(d);
      parts.push('<span>آخر تحديث: ' + ds + '</span>');
    }catch(e){}
  }
  meta.innerHTML = parts.join('');

  var grid = document.getElementById('grid');
  if (!cars.length){ document.getElementById('emptyState').hidden = false; }

  function specHTML(car){
    var items = [];
    if (car.year) items.push(['سنة الصنع', car.year]);
    if (car.mileage !== null && car.mileage !== undefined && car.mileage !== '') items.push(['الممشى', fmt(car.mileage) + ' كم']);
    if (car.color) items.push(['اللون', car.color]);
    if (car.transmission) items.push(['ناقل الحركة', car.transmission]);
    if (car.condition) items.push(['الحالة', car.condition]);
    if (!items.length) return '';
    return '<div class="specs">' + items.map(function(it){
      return '<div class="spec"><span class="k">' + esc(it[0]) + '</span><span class="v">' + esc(it[1]) + '</span></div>';
    }).join('') + '</div>';
  }

  cars.forEach(function(car, idx){
    var title = (car.make + ' ' + car.model + ' ' + (car.year || '')).replace(/\s+/g,' ').trim();
    var photos = car.photos || [];
    var isSold = car.status === 'sold';

    var card = document.createElement('article');
    card.className = 'card' + (isSold ? ' sold' : '');

    var html = '<div class="photo-wrap">';
    if (isSold) html += '<span class="badge-sold">مباعة</span>';
    if (photos.length){
      html += '<img class="photo-main" src="' + esc(photos[0]) + '" alt="' + esc(title) + '" loading="lazy" tabindex="0" role="button" aria-label="تكبير صور ' + esc(title) + '">';
      if (photos.length > 1) html += '<span class="photo-count">' + fmt(photos.length) + ' صور</span>';
    }
    html += '</div>';
    if (photos.length > 1){
      html += '<div class="thumbs">' + photos.map(function(p,i){
        return '<button class="thumb' + (i === 0 ? ' active' : '') + '" data-i="' + i + '" aria-label="صورة ' + (i+1) + '"><img src="' + esc(p) + '" alt="" loading="lazy"></button>';
      }).join('') + '</div>';
    }
    html += '<div class="body">';
    html += '<h2 class="car-title">' + esc(title) + '</h2>';
    if (car.price !== null && car.price !== undefined){
      html += '<div class="price">' + fmt(car.price) + ' <small>ج.م</small></div>';
    }
    html += specHTML(car);
    if (car.description){
      html += '<div class="desc-wrap"><p class="desc" id="desc-' + idx + '">' + esc(car.description) + '</p>';
      html += '<button class="toggle-desc" data-target="desc-' + idx + '" hidden>عرض الوصف بالكامل</button></div>';
    }
    html += '</div>';
    card.innerHTML = html;
    grid.appendChild(card);

    // معرض الصور داخل الكارت
    var mainImg = card.querySelector('.photo-main');
    var thumbs = card.querySelectorAll('.thumb');
    function currentIndex(){
      var act = card.querySelector('.thumb.active');
      return act ? +act.dataset.i : 0;
    }
    function setPhoto(i){
      if (!mainImg) return;
      mainImg.src = photos[i];
      thumbs.forEach(function(t){ t.classList.toggle('active', +t.dataset.i === i); });
    }
    thumbs.forEach(function(t){
      t.addEventListener('click', function(){ setPhoto(+t.dataset.i); });
    });
    if (mainImg){
      mainImg.addEventListener('click', function(){ openLightbox(photos, title, currentIndex()); });
      mainImg.addEventListener('keydown', function(e){
        if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); openLightbox(photos, title, currentIndex()); }
      });
    }
  });

  // قصّ الوصف الطويل مع زر عرض الكل
  document.querySelectorAll('.desc').forEach(function(p){
    if (p.scrollHeight > 190){
      p.classList.add('clamped');
      var btn = document.querySelector('.toggle-desc[data-target="' + p.id + '"]');
      if (btn){
        btn.hidden = false;
        btn.addEventListener('click', function(){
          var stillClamped = p.classList.toggle('clamped');
          btn.textContent = stillClamped ? 'عرض الوصف بالكامل' : 'عرض أقل';
        });
      }
    }
  });

  // ---------- Lightbox ----------
  var lb = document.getElementById('lightbox');
  var lbImg = document.getElementById('lbImg');
  var lbTitle = document.getElementById('lbTitle');
  var lbCount = document.getElementById('lbCount');
  var lbPhotos = [], lbIndex = 0, lbName = '';

  function renderLb(){
    lbImg.src = lbPhotos[lbIndex];
    lbImg.alt = lbName;
    lbTitle.textContent = lbName;
    lbCount.textContent = fmt(lbIndex + 1) + ' / ' + fmt(lbPhotos.length);
  }
  function openLightbox(photos, name, start){
    if (!photos.length) return;
    lbPhotos = photos; lbName = name; lbIndex = start || 0;
    renderLb();
    lb.classList.add('open');
    document.body.style.overflow = 'hidden';
  }
  function closeLightbox(){
    lb.classList.remove('open');
    document.body.style.overflow = '';
  }
  document.getElementById('lbClose').addEventListener('click', closeLightbox);
  document.getElementById('lbNext').addEventListener('click', function(){ lbIndex = (lbIndex + 1) % lbPhotos.length; renderLb(); });
  document.getElementById('lbPrev').addEventListener('click', function(){ lbIndex = (lbIndex - 1 + lbPhotos.length) % lbPhotos.length; renderLb(); });
  lb.addEventListener('click', function(e){ if (e.target === lb) closeLightbox(); });
  document.addEventListener('keydown', function(e){
    if (!lb.classList.contains('open')) return;
    if (e.key === 'Escape') closeLightbox();
    if (e.key === 'ArrowLeft') document.getElementById('lbNext').click();
    if (e.key === 'ArrowRight') document.getElementById('lbPrev').click();
  });
})();
</script>
</body>
</html>
